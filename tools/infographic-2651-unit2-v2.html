<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  body { width: 1080px; background: #ffffff;
         font-family: 'Noto Sans Bengali', 'DejaVu Sans', sans-serif; }
  .bn { font-family: 'Noto Sans Bengali', 'DejaVu Sans', sans-serif; }
  .serif { font-family: 'Noto Serif Bengali', serif; }
</style>
</head>
<body>
<svg width="1080" height="1840" viewBox="0 0 1080 1840" xmlns="http://www.w3.org/2000/svg">
  <!-- faint background blobs -->
  <ellipse cx="80" cy="300" rx="220" ry="130" fill="#f5f3ee"/>
  <ellipse cx="1010" cy="900" rx="190" ry="150" fill="#f5f3ee"/>
  <ellipse cx="120" cy="1350" rx="170" ry="110" fill="#f7f5f0"/>

  <!-- header band -->
  <rect x="0" y="0" width="1080" height="120" fill="#16265c"/>
  <text x="540" y="70" text-anchor="middle" class="serif" font-size="62" font-weight="bold" fill="#f5c542">ধ্বনিতত্ত্ব (ইউনিট-০২)</text>
  <text x="540" y="104" text-anchor="middle" class="bn" font-size="23" fill="#ffffff">SSC-2651 • বাংলা দ্বিতীয় পত্র</text>

  <!-- ===== top leaves ===== -->
  <!-- left leaf: ধ্বনি পরিবর্তন -->
  <ellipse cx="280" cy="285" rx="235" ry="112" fill="#dceefb" transform="rotate(-10 280 285)"/>
  <text x="140" y="252" class="bn" font-size="46">🔄</text>
  <text x="200" y="252" class="bn" font-size="30" font-weight="bold" fill="#1b4f72">ধ্বনি পরিবর্তন</text>
  <text x="140" y="306" class="bn" font-size="25" fill="#1a1a2e">৬ ধরন: স্বরাগম, স্বরলোপ,</text>
  <text x="140" y="342" class="bn" font-size="25" fill="#1a1a2e">ব্যঞ্জনাগম, ধ্বনিবিপর্যয়,</text>
  <text x="140" y="378" class="bn" font-size="25" fill="#1a1a2e">সমীভবন, বিষমীভবন</text>

  <!-- right leaf: পরীক্ষায় মনে রাখবে -->
  <ellipse cx="800" cy="285" rx="235" ry="112" fill="#eadcf7" transform="rotate(10 800 285)"/>
  <text x="640" y="252" class="bn" font-size="46">📝</text>
  <text x="700" y="252" class="bn" font-size="30" font-weight="bold" fill="#6b3fa0">পরীক্ষায় মনে রাখবে</text>
  <text x="640" y="306" class="bn" font-size="25" fill="#1a1a2e">ণ-ত্ব/ষ-ত্বের নিয়ম ও ব্যতিক্রম</text>
  <text x="640" y="342" class="bn" font-size="25" fill="#1a1a2e">সন্ধি-বিচ্ছেদ ও সন্ধি নির্ণয়</text>
  <text x="640" y="378" class="bn" font-size="25" fill="#1a1a2e">উদাহরণ বুঝে লিখবে, মুখস্থ নয়</text>

  <!-- ===== branches ===== -->
  <path d="M 505 1120 C 420 1040, 360 860, 392 642" fill="none" stroke="#0e9a8b" stroke-width="24" stroke-linecap="round"/>
  <path d="M 575 1120 C 660 1040, 720 860, 688 642" fill="none" stroke="#7cb342" stroke-width="24" stroke-linecap="round"/>
  <path d="M 500 1210 C 425 1180, 385 1120, 390 1032" fill="none" stroke="#d63384" stroke-width="24" stroke-linecap="round"/>
  <path d="M 580 1210 C 655 1180, 695 1120, 690 1032" fill="none" stroke="#e0a408" stroke-width="24" stroke-linecap="round"/>

  <!-- leaves on branches -->
  <ellipse cx="430" cy="920" rx="26" ry="11" fill="#0e9a8b" opacity="0.55" transform="rotate(-35 430 920)"/>
  <ellipse cx="410" cy="770" rx="26" ry="11" fill="#0e9a8b" opacity="0.55" transform="rotate(-55 410 770)"/>
  <ellipse cx="455" cy="850" rx="26" ry="11" fill="#0e9a8b" opacity="0.5" transform="rotate(-40 455 850)"/>
  <ellipse cx="395" cy="720" rx="24" ry="10" fill="#0e9a8b" opacity="0.5" transform="rotate(-60 395 720)"/>
  <ellipse cx="650" cy="920" rx="26" ry="11" fill="#7cb342" opacity="0.55" transform="rotate(35 650 920)"/>
  <ellipse cx="670" cy="770" rx="26" ry="11" fill="#7cb342" opacity="0.55" transform="rotate(55 670 770)"/>
  <ellipse cx="625" cy="850" rx="26" ry="11" fill="#7cb342" opacity="0.5" transform="rotate(40 625 850)"/>
  <ellipse cx="685" cy="720" rx="24" ry="10" fill="#7cb342" opacity="0.5" transform="rotate(60 685 720)"/>
  <ellipse cx="520" cy="780" rx="26" ry="11" fill="#7cb342" opacity="0.45" transform="rotate(-30 520 780)"/>
  <ellipse cx="560" cy="760" rx="26" ry="11" fill="#0e9a8b" opacity="0.45" transform="rotate(30 560 760)"/>
  <ellipse cx="440" cy="1140" rx="26" ry="11" fill="#d63384" opacity="0.55" transform="rotate(-25 440 1140)"/>
  <ellipse cx="640" cy="1140" rx="26" ry="11" fill="#e0a408" opacity="0.55" transform="rotate(25 640 1140)"/>

  <!-- ===== trunk ===== -->
  <path d="M 420 1100 C 415 1200, 400 1300, 390 1400 Q 360 1400, 345 1440 L 735 1440 Q 720 1400, 690 1400 C 680 1300, 665 1200, 660 1100 Z" fill="#16265c"/>
  <text x="540" y="1222" text-anchor="middle" class="bn" font-size="44" font-weight="bold" fill="#ffffff">ধ্বনিতত্ত্ব</text>
  <text x="540" y="1282" text-anchor="middle" class="bn" font-size="23" fill="#ffffff">ধ্বনি = উচ্চারিত একক</text>
  <text x="540" y="1318" text-anchor="middle" class="bn" font-size="23" fill="#ffffff">বর্ণ = লিখিত রূপ</text>

  <!-- ===== branch circles + text ===== -->
  <!-- upper-left: সংজ্ঞা -->
  <circle cx="350" cy="604" r="58" fill="#0a7a6e"/>
  <circle cx="350" cy="600" r="58" fill="#0e9a8b" stroke="#ffffff" stroke-width="4"/>
  <text x="350" y="600" text-anchor="middle" dominant-baseline="central" font-size="54">🔊</text>
  <text x="24" y="552" class="bn" font-size="34" font-weight="bold" fill="#0e7a6e">১. ধ্বনি ও বর্ণ</text>
  <text x="24" y="598" class="bn" font-size="26" fill="#1a1a2e">ধ্বনি = উচ্চারিত</text>
  <text x="24" y="634" class="bn" font-size="26" fill="#1a1a2e">ক্ষুদ্রতম একক</text>
  <text x="24" y="670" class="bn" font-size="26" fill="#1a1a2e">বর্ণ = লিখিত রূপ</text>

  <!-- upper-right: ৫টি বৈশিষ্ট্য -->
  <circle cx="730" cy="604" r="58" fill="#5f8f2e"/>
  <circle cx="730" cy="600" r="58" fill="#7cb342" stroke="#ffffff" stroke-width="4"/>
  <text x="730" y="600" text-anchor="middle" dominant-baseline="central" font-size="54">🗣️</text>
  <text x="800" y="552" class="bn" font-size="34" font-weight="bold" fill="#5a8f2a">২. উচ্চারণবিধি</text>
  <text x="800" y="598" class="bn" font-size="26" fill="#1a1a2e">অ-এর উচ্চারণ কখন 'অ',</text>
  <text x="800" y="634" class="bn" font-size="26" fill="#1a1a2e">আর কখন 'ও'-এর মতো —</text>
  <text x="800" y="670" class="bn" font-size="26" fill="#1a1a2e">নিয়ম দিয়ে শিখবে</text>

  <!-- lower-left: সংখ্যায় বাংলা -->
  <circle cx="350" cy="994" r="58" fill="#b02a6e"/>
  <circle cx="350" cy="990" r="58" fill="#d63384" stroke="#ffffff" stroke-width="4"/>
  <text x="350" y="990" text-anchor="middle" dominant-baseline="central" font-size="54">🔤</text>
  <text x="24" y="942" class="bn" font-size="34" font-weight="bold" fill="#c2185b">৩. ণ-ত্ব ও ষ-ত্ব বিধান</text>
  <text x="24" y="988" class="bn" font-size="26" fill="#1a1a2e">ঋ/র/ষ-এর পর 'ণ'</text>
  <text x="24" y="1024" class="bn" font-size="26" fill="#1a1a2e">যেমন: ঋণ, বর্ণ</text>
  <text x="24" y="1060" class="bn" font-size="26" fill="#1a1a2e">ই/উ/ঋ/ক/র-এর পর 'ষ'</text>
  <text x="24" y="1096" class="bn" font-size="26" fill="#1a1a2e">যেমন: ঋষি, কৃষি</text>

  <!-- lower-right: ভাষার রূপ -->
  <circle cx="730" cy="994" r="58" fill="#b8860b"/>
  <circle cx="730" cy="990" r="58" fill="#e0a408" stroke="#ffffff" stroke-width="4"/>
  <text x="730" y="990" text-anchor="middle" dominant-baseline="central" font-size="54">🔗</text>
  <text x="800" y="942" class="bn" font-size="34" font-weight="bold" fill="#b8860b">৪. সন্ধি</text>
  <text x="800" y="988" class="bn" font-size="26" fill="#1a1a2e">দুটি ধ্বনির মিলন</text>
  <text x="800" y="1024" class="bn" font-size="26" fill="#1a1a2e">৩ প্রকার: স্বর, ব্যঞ্জন,</text>
  <text x="800" y="1060" class="bn" font-size="26" fill="#1a1a2e">বিসর্গ</text>

  <!-- ===== bottom row: সন্ধির ৩ প্রকার ===== -->
  <text x="540" y="1520" text-anchor="middle" class="bn" font-size="36" font-weight="bold" fill="#16265c">সন্ধির ৩ প্রকার</text>

  <circle cx="240" cy="1604" r="52" fill="#3a7bc2"/>
  <circle cx="240" cy="1600" r="52" fill="#4a90d9" stroke="#ffffff" stroke-width="4"/>
  <text x="240" y="1600" text-anchor="middle" dominant-baseline="central" font-size="48">🎵</text>
  <text x="240" y="1692" text-anchor="middle" class="bn" font-size="30" font-weight="bold" fill="#4a90d9">স্বরসন্ধি</text>
  <text x="240" y="1726" text-anchor="middle" class="bn" font-size="24" fill="#1a1a2e">স্বর + স্বর</text>
  <text x="240" y="1756" text-anchor="middle" class="bn" font-size="24" fill="#1a1a2e">বিদ্যা + আলয় = বিদ্যালয়</text>

  <circle cx="540" cy="1604" r="52" fill="#5f8f2e"/>
  <circle cx="540" cy="1600" r="52" fill="#7cb342" stroke="#ffffff" stroke-width="4"/>
  <text x="540" y="1600" text-anchor="middle" dominant-baseline="central" font-size="48">🔤</text>
  <text x="540" y="1692" text-anchor="middle" class="bn" font-size="30" font-weight="bold" fill="#7cb342">ব্যঞ্জনসন্ধি</text>
  <text x="540" y="1726" text-anchor="middle" class="bn" font-size="24" fill="#1a1a2e">ব্যঞ্জন + স্বর/ব্যঞ্জন</text>
  <text x="540" y="1756" text-anchor="middle" class="bn" font-size="24" fill="#1a1a2e">উৎ + চারণ = উচ্চারণ</text>

  <circle cx="840" cy="1604" r="52" fill="#7d4fa3"/>
  <circle cx="840" cy="1600" r="52" fill="#9b59b6" stroke="#ffffff" stroke-width="4"/>
  <text x="840" y="1600" text-anchor="middle" dominant-baseline="central" font-size="48">✨</text>
  <text x="840" y="1692" text-anchor="middle" class="bn" font-size="30" font-weight="bold" fill="#9b59b6">বিসর্গসন্ধি</text>
  <text x="840" y="1726" text-anchor="middle" class="bn" font-size="24" fill="#1a1a2e">বিসর্গ + স্বর/ব্যঞ্জন</text>

  <!-- footer -->
  <text x="540" y="1822" text-anchor="middle" class="bn" font-size="22" fill="#7a7a9a">তথ্য: BOU SSC-2651 বই (পৃ. ৮–৩৬) • Under Teacher Review</text>
</svg>
</body>
</html>
